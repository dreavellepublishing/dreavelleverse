<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chapter Editor | DreavelleVerse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="chapter-editor-page">

    <header>
        <div class="header-brand">
            <h1>DreavelleVerse</h1>
            <p>Where Stories Come Alive.</p>
        </div>

        <nav>
    <a href="index.html">Home</a>
    <a href="discover.html">Discover</a>
    <a href="library.html">Library</a>
    <a href="write.html">Write</a>
    <a href="notifications.html" id="notifications-nav-link">Notifications</a>

    <a href="login.html" id="login-nav-link">Log In</a>

    <a href="signup.html" class="signup-link" id="signup-nav-link">
        Sign Up
    </a>

    <span id="user-nav" style="display: none;">
        <span id="user-display-name"></span>

        <button type="button" id="logout-button">
            Log Out
        </button>
    </span>
</nav>
    </header>

    <main class="editor-page">

        <div class="editor-container">

           <div class="editor-topbar">

    <div>
        <a href="story-manager.html" class="back-to-story">
            ← Back to Story
        </a>

        <p class="editor-story-name">Untitled Story</p>
        <p class="editor-chapter-number">Chapter 1</p>
        <p class="save-status">Draft</p>
    </div>

    <button class="save-draft-button">
        Save Draft
    </button>

</div>

            <input
                type="text"
                class="chapter-title-input"
                placeholder="Chapter Title"
            >
<div class="bible-verse-card" id="bible-verse-card">
    <p class="bible-verse-label">Verse for You</p>

    <p class="bible-verse-text" id="bible-verse-text">
        A verse will appear here.
    </p>

    <p class="bible-verse-reference" id="bible-verse-reference">
        — Bible
    </p>
</div>
            <textarea
                class="chapter-writing-area"
                placeholder="Start writing your chapter..."
            ></textarea>

           <div class="chapter-schedule-section" id="chapter-schedule-section">
    <p class="chapter-schedule-title">Schedule Chapter</p>

    <div class="chapter-schedule-controls">
        <div class="schedule-field">
            <label for="schedule-date">Publish Date</label>
            <input
                type="date"
                id="schedule-date"
                class="schedule-input"
            >
        </div>

        <div class="schedule-field">
            <label for="schedule-time">Publish Time</label>
            <input
                type="time"
                id="schedule-time"
                class="schedule-input"
            >
        </div>

        <button
            type="button"
            id="schedule-chapter-button"
            class="schedule-chapter-button"
        >
            Schedule Chapter
        </button>

        <button
    type="button"
    id="reschedule-chapter-button"
    class="schedule-chapter-button"
    style="display: none;"
>
    Reschedule
</button>

<button
    type="button"
    id="cancel-schedule-button"
    class="cancel-schedule-button"
    style="display: none;"
>
    Cancel Schedule
</button>

    </div>
</div>
            <div class="editor-bottom">
    <span class="word-count">0 words</span>

    <div class="chapter-action-buttons">
        <button
            type="button"
            class="delete-chapter-button"
            id="delete-chapter-button"
        >
            Delete Chapter
        </button>

        <button
            type="button"
            class="publish-chapter-button"
        >
            Publish Chapter
        </button>
        <button
    type="button"
    class="unpublish-chapter-button"
    id="unpublish-chapter-button"
>
    Unpublish Chapter
</button>

    </div>
</div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>

</html>
